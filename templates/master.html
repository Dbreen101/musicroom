<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master — Music Room</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {{ theme_head|safe }}
    <link rel="stylesheet" href="/static/css/explore-theme.css">
    <link rel="stylesheet" href="/static/css/gr.css">
    <script src="/static/js/room_transition.js"></script>
    <link rel="stylesheet" href="/static/css/ui.css">
    <style>
        /* the master page (gr_master.py on the rooms server answers it, only for the master, only on the server's own Mac) */
        .ms-tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--border); margin: 6px 0 18px; }
        .ms-tabs button { appearance: none; padding: 10px 14px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted);
            font-family: var(--f-mono, monospace); font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
        .ms-tabs button.on { color: var(--text); border-bottom-color: var(--text); }
        .ms-tabs b { font-weight: 400; margin-left: 6px; padding: 0 5px; background: var(--red); color: var(--bg); }
        .ms-row { display: grid; grid-template-columns: 1fr auto; gap: 8px 18px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .ms-row__t { font-family: var(--f-display, Georgia, serif); font-size: 1.2rem; line-height: 1.2; }
        .ms-row__s { font-family: var(--f-mono, monospace); font-size: .62rem; letter-spacing: .04em; color: var(--muted); line-height: 1.7; }
        .ms-row__n { margin-top: 6px; font-size: .86rem; line-height: 1.55; }
        .ms-acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; }
        .ms-why { width: 220px; }
        .ms-acts select, .ms-acts input { padding: 6px 8px; border: 1px solid var(--border2); border-radius: 0; background: none; color: var(--text);
            font-family: var(--f-mono, monospace); font-size: .66rem; }
        .ms-btn { appearance: none; padding: 6px 10px; border: 1px solid var(--border2); border-radius: 0; background: none; color: var(--text);
            font-family: var(--f-mono, monospace); font-size: .6rem; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
        .ms-btn:hover { border-color: var(--text); }
        .ms-btn--go { background: var(--text); border-color: var(--text); color: var(--bg); }
        .ms-btn--red { border-color: var(--red); color: var(--red); }
        .ms-tag { display: inline-block; margin-right: 6px; padding: 1px 5px; border: 1px solid var(--border2); font-size: .56rem; letter-spacing: .1em; text-transform: uppercase; }
        .ms-tag--red { border-color: var(--red); color: var(--red); }
        .ms-none { padding: 18px 0; font-size: .86rem; color: var(--muted); }
        .ms-filter { display: flex; gap: 6px; margin-bottom: 8px; }
        .ms-cover { width: 64px; height: 64px; object-fit: cover; border: 1px solid var(--border); margin-right: 12px; float: left; }
        .ms-form { display: grid; gap: 10px; max-width: 560px; }
        .ms-form label { font-family: var(--f-mono, monospace); font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
        .ms-form input { padding: 9px 10px; border: 1px solid var(--border2); border-radius: 0; background: none; color: var(--text); font-size: .9rem; }
        .ms-said { min-height: 1.4em; font-family: var(--f-mono, monospace); font-size: .66rem; color: var(--muted); }
        audio { height: 32px; vertical-align: middle; }
        /* the credits trial (gr_sim.py) */
        .ms-h2 { font-family: var(--f-display, Georgia, serif); font-weight: 400; font-size: 1.6rem; margin: 26px 0 6px; }
        .ms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 18px; max-width: 900px; align-items: end; }
        .ms-grid label { display: grid; gap: 4px; font-family: var(--f-mono, monospace); font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
        .ms-grid input, .ms-grid select, .ms-line input, .ms-line select { padding: 8px 9px; border: 1px solid var(--border2); border-radius: 0; background: none; color: var(--text);
            font-family: var(--f-mono, monospace); font-size: .8rem; text-transform: none; letter-spacing: 0; }
        .ms-line { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
        .ms-line input[type=text], .ms-line input:not([type]) { flex: 1 1 260px; }
        .ms-switch { display: inline-flex; gap: 8px; align-items: center; font-family: var(--f-mono, monospace); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; }
        .ms-table { width: 100%; border-collapse: collapse; font-family: var(--f-mono, monospace); font-size: .68rem; }
        .ms-table th { text-align: right; font-weight: 400; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-size: .56rem; padding: 6px 6px; border-bottom: 1px solid var(--text); vertical-align: bottom; }
        .ms-table td { text-align: right; padding: 7px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
        .ms-table th:first-child, .ms-table td:first-child { text-align: left; }
        .ms-wide { overflow-x: auto; }
        .ms-key { padding: 12px 0; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body class="gr-page">
{% include "_gr_nav.html" %}
<main class="gr-main">
    <header class="gr-hero">
        <div class="gr-eyebrow">Master</div>
        <h1 class="gr-h1">The Music Room</h1>
        <p class="gr-lede" id="ms-lede"></p>
    </header>
    <nav class="ms-tabs" id="ms-tabs">
        <button data-tab="accounts">Accounts<b id="n-requests" hidden></b></button>
        <button data-tab="records">Records<b id="n-pending" hidden></b></button>
        <button data-tab="reports">Reports<b id="n-reports" hidden></b></button>
        <button data-tab="feedback">Feedback<b id="n-feedback" hidden></b></button>
        <button data-tab="version">Version</button>
        <button data-tab="trial">Credits trial</button>
        <button data-tab="spotify">Spotify keys</button>
        <button data-tab="activity">Activity</button>
    </nav>
    <div class="ms-said" id="ms-said" role="status"></div>
    <section id="ms-body"></section>
</main>
<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const when = s => s ? String(s).replace('T', ' ').slice(0, 16) : '';
const KINDS = ['listener', 'artist', 'digital artist', 'label', 'shop', 'venue', 'business'];
let TAB = (location.hash || '#accounts').slice(1), STATUS = {};
const body = document.getElementById('ms-body'), said = document.getElementById('ms-said');
async function api(path, data) {
    try {
        const r = await fetch('/api/gr/master/' + path, data ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) } : undefined);
        const d = await r.json().catch(() => ({}));
        return { ok: r.ok, d };
    } catch (_) { return { ok: false, d: { error: 'The app can’t be reached.' } }; }
}
function badge(id, n) { const b = document.getElementById(id); b.hidden = !n; b.textContent = n || ''; }
async function overview() {
    const r = await api('overview');
    if (!r.ok) {
        document.getElementById('ms-tabs').hidden = true;
        body.innerHTML = `<p class="ms-none">${esc(r.d.error || 'The master page can’t be opened.')}</p>
            <p class="ms-none">This page is for the master account, on the Mac the rooms server runs on.</p>`;
        return false;
    }
    badge('n-requests', r.d.requests); badge('n-pending', r.d.pending); badge('n-reports', r.d.reports); badge('n-feedback', r.d.feedback);
    document.getElementById('ms-lede').textContent = `Signed in as ${r.d.me.name}. ${r.d.accounts} accounts.`;
    return true;
}
function show(tab) {
    TAB = tab; history.replaceState(null, '', '#' + tab); said.textContent = '';
    document.querySelectorAll('#ms-tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    ({ accounts, records, reports, feedback, version, trial, spotify, activity }[tab] || accounts)();
}
document.getElementById('ms-tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(b.dataset.tab); });

// ── accounts: requests first, then everyone ──
async function accounts() {
    const r = await api('accounts');
    if (!r.ok) { body.innerHTML = `<p class="ms-none">${esc(r.d.error)}</p>`; return; }
    body.innerHTML = r.d.accounts.map(a => `
      <div class="ms-row" data-id="${a.id}">
        <div>
          <div class="ms-row__t">${esc(a.name)} ${a.is_master ? '<span class="ms-tag ms-tag--red">master</span>' : ''}${a.paused ? '<span class="ms-tag ms-tag--red">paused</span>' : ''}${a.hidden ? '<span class="ms-tag ms-tag--red">room taken down</span>' : ''}</div>
          <div class="ms-row__s">@${esc(a.handle)} · ${esc(a.kind)}${a.is_public ? ' · public room' : ''} · joined ${when(a.created_at)} · last seen ${when(a.last_seen) || '—'}
            · ${a.devices} device${a.devices === 1 ? '' : 's'} · ${a.records} record${a.records === 1 ? '' : 's'}${a.pending ? ` (${a.pending} waiting)` : ''} · ${a.borrows} borrowed · ${a.bought} bought</div>
          ${a.kind_requested ? `<div class="ms-row__n">Asks to be <b>${esc(a.kind_requested)}</b>.</div>` : ''}
          ${a.paused && a.paused_note ? `<div class="ms-row__n">Paused: ${esc(a.paused_note)}</div>` : ''}
          ${a.hidden && a.hidden_note ? `<div class="ms-row__n">Room taken down: ${esc(a.hidden_note)}</div>` : ''}
        </div>
        <div class="ms-acts">
          ${a.kind_requested ? `<button class="ms-btn ms-btn--go" data-do="approve">Make ${esc(a.kind_requested)}</button><button class="ms-btn" data-do="refuse">Keep as ${esc(a.kind)}</button>` : ''}
          <select data-do="kind" aria-label="Kind of account">${KINDS.map(k => `<option ${k === a.kind ? 'selected' : ''}>${k}</option>`).join('')}</select>
          ${a.hidden ? `<button class="ms-btn" data-do="unhide">Put the room back</button>` : ''}
          ${a.devices && !a.is_master ? `<button class="ms-btn" data-do="devices" title="Signs this account out on every device. Its person signs in again with their account code.">Sign out its devices</button>` : ''}
          ${a.is_master ? '' : (a.paused ? `<button class="ms-btn" data-do="unpause">Unpause</button>` : `${WHY}<button class="ms-btn ms-btn--red" data-do="pause">Pause</button>`)}
        </div>
      </div>`).join('') || '<p class="ms-none">No accounts yet.</p>';
}
body.addEventListener('change', async e => {
    const sel = e.target.closest('select[data-do="kind"]'); if (!sel) return;
    const id = sel.closest('[data-id]').dataset.id;
    const r = await api('accounts/' + id, { kind: sel.value });
    said.textContent = r.ok ? 'Done: ' + r.d.did.join(', ') : r.d.error; overview(); accounts();
});
body.addEventListener('click', async e => {
    const b = e.target.closest('[data-do]'); if (!b || b.tagName === 'SELECT') return;
    const row = b.closest('[data-id]'), id = row && row.dataset.id, d = b.dataset.do;
    let r;
    if (TAB === 'accounts') {
        const send = { approve: { request: 'approve' }, refuse: { request: 'refuse' }, unpause: { paused: false }, unhide: { hidden: false }, devices: { devices: 'free' } }[d];
        if (d === 'pause') r = await api('accounts/' + id, { paused: true, note: why(row) });
        else if (send) r = await api('accounts/' + id, send);
        if (r) { said.textContent = r.ok ? 'Done: ' + r.d.did.join(', ') : r.d.error; overview(); accounts(); }
    } else if (TAB === 'records') {
        if (d === 'live') r = await api('records/' + id, { status: 'live' });
        else if (d === 'refuse' || d === 'hide') r = await api('records/' + id, { status: d === 'refuse' ? 'refused' : 'hidden', note: why(row) });
        else if (d === 'show') { STATUS.records = b.dataset.s; return records(); }
        if (r) { said.textContent = r.ok ? 'Done.' : r.d.error; overview(); records(); }
    } else if (TAB === 'reports') {
        if (d === 'hide' || d === 'none') r = await api('reports/' + id, { action: d, note: d === 'hide' ? why(row) : '' });
        else if (d === 'show') { STATUS.reports = b.dataset.s; return reports(); }
        if (r) { said.textContent = r.ok ? (r.d.action === 'hidden' ? 'Taken down.' : 'Left as it is.') : r.d.error; overview(); reports(); }
    } else if (TAB === 'feedback') {
        if (d === 'done' || d === 'open') r = await api('feedback/' + id, { status: d });
        else if (d === 'show') { STATUS.feedback = b.dataset.s; return feedback(); }
        if (r) { overview(); feedback(); }
    }
});
const why = row => { const i = row && row.querySelector('.ms-why'); return i ? i.value.trim() : ''; };
const WHY = `<input class="ms-why" placeholder="why (they will see this)" aria-label="Why — they will see this">`;
function filters(tab, list) {
    const cur = STATUS[tab] || list[0][0];
    return `<div class="ms-filter">${list.map(([k, l]) => `<button class="ms-btn ${k === cur ? 'ms-btn--go' : ''}" data-do="show" data-s="${k}">${l}</button>`).join('')}</div>`;
}

// ── records: waiting first; play, then approve / refuse / take down ──
async function records() {
    const st = STATUS.records || 'pending';
    const r = await api('records?status=' + st);
    if (!r.ok) { body.innerHTML = `<p class="ms-none">${esc(r.d.error)}</p>`; return; }
    body.innerHTML = filters('records', [['pending', 'Waiting'], ['live', 'Out'], ['refused', 'Refused'], ['hidden', 'Taken down']]) + (r.d.records.map(t => `
      <div class="ms-row" data-id="${t.id}">
        <div>
          ${t.has_art ? `<img class="ms-cover" src="/api/gr/master/records/${t.id}/art" alt="">` : ''}
          <div class="ms-row__t">${esc(t.title || 'Untitled')}${t.exclusive ? ' <span class="excl" title="Its owner says it is only in the Music Room">Exclusive</span>' : ''}</div>
          <div class="ms-row__s">${esc(t.artist || '')}${t.album ? ' · ' + esc(t.album) : ''}${t.label ? ' · ' + esc(t.label) : ''}${t.year ? ' · ' + t.year : ''}${t.genre ? ' · ' + esc(t.genre) : ''}
            <br>by @${esc(t.owner ? t.owner.handle : '—')} (${esc(t.owner ? t.owner.kind : '')}) · ${esc(t.format || '')} · €${((t.price_cents || 0) / 100).toFixed(2)} · added ${when(t.added_at)}</div>
          <div class="ms-row__n" style="clear:both">They said: “${esc(t.rights_note || '—')}”</div>
          ${t.review_note ? `<div class="ms-row__n">Your note: ${esc(t.review_note)}</div>` : ''}
          <div style="margin-top:8px"><audio controls preload="none" src="/api/gr/master/records/${t.id}/audio"></audio></div>
        </div>
        <div class="ms-acts">
          ${t.status !== 'live' ? `<button class="ms-btn ms-btn--go" data-do="live">Approve — put it out</button>` : ''}
          ${t.status === 'pending' || t.status === 'live' ? WHY : ''}
          ${t.status === 'pending' ? `<button class="ms-btn ms-btn--red" data-do="refuse">Refuse</button>` : ''}
          ${t.status === 'live' ? `<button class="ms-btn ms-btn--red" data-do="hide">Take it down</button>` : ''}
        </div>
      </div>`).join('') || `<p class="ms-none">${st === 'pending' ? 'Nothing waiting.' : 'None.'}</p>`);
}

// ── reports ──
async function reports() {
    const st = STATUS.reports || 'open';
    const r = await api('reports?status=' + st);
    if (!r.ok) { body.innerHTML = `<p class="ms-none">${esc(r.d.error)}</p>`; return; }
    const link = x => x.what === 'room' ? `<a href="/rooms/${encodeURIComponent(x.ref)}" target="_blank">open the room</a>` : '';
    body.innerHTML = filters('reports', [['open', 'Open'], ['done', 'Settled']]) + (r.d.reports.map(x => `
      <div class="ms-row" data-id="${x.id}">
        <div>
          <div class="ms-row__t"><span class="ms-tag">${esc(x.what === 'grupa' ? 'grúpa' : x.what)}</span>${esc(x.title || x.ref)}</div>
          <div class="ms-row__s">whose: @${esc(x.owner.handle || '—')} · reported by @${esc(x.by.handle || '—')} · ${when(x.at)} ${link(x)}</div>
          <div class="ms-row__n"><b>${esc(x.reason_label)}</b>${x.note ? ' — ' + esc(x.note) : ''}</div>
          ${x.status === 'done' ? `<div class="ms-row__s">${x.action === 'hidden' ? 'Taken down' : 'Left as it was'}${x.resolved_note ? ': ' + esc(x.resolved_note) : ''} · ${when(x.resolved_at)}</div>` : ''}
        </div>
        <div class="ms-acts">${x.status === 'open' ? `${WHY}<button class="ms-btn ms-btn--red" data-do="hide">Take it down</button><button class="ms-btn" data-do="none">Leave it</button>` : ''}</div>
      </div>`).join('') || `<p class="ms-none">${st === 'open' ? 'No reports waiting.' : 'None.'}</p>`);
}

// ── feedback and bug reports ──
async function feedback() {
    const st = STATUS.feedback || 'open';
    const r = await api('feedback?status=' + st);
    if (!r.ok) { body.innerHTML = `<p class="ms-none">${esc(r.d.error)}</p>`; return; }
    body.innerHTML = filters('feedback', [['open', 'Open'], ['done', 'Done'], ['all', 'All']]) + (r.d.feedback.map(f => `
      <div class="ms-row" data-id="${f.id}">
        <div>
          <div class="ms-row__s"><span class="ms-tag ${f.kind === 'bug' ? 'ms-tag--red' : ''}">${esc(f.kind)}</span>@${esc(f.by.handle || '—')} · ${when(f.at)} · ${esc(f.page)}</div>
          <div class="ms-row__n">${esc(f.note)}</div>
        </div>
        <div class="ms-acts">${f.status === 'open' ? `<button class="ms-btn" data-do="done">Done</button>` : `<button class="ms-btn" data-do="open">Open again</button>`}</div>
      </div>`).join('') || '<p class="ms-none">Nothing here.</p>');
}

// ── the version everyone should be on ──
async function version() {
    const r = await api('overview');
    const v = (r.d && r.d.version) || {}, door = (r.d && r.d.door) || {};
    body.innerHTML = `
      <p class="gr-lede" style="max-width:640px">This app is version <code>{{ app_version or '—' }}</code>.</p>
      <form class="ms-form" id="ms-ver">
        <label for="v-version">Version</label><input id="v-version" value="${esc(v.version || '')}" placeholder="2026.11.20">
        <label for="v-url">Where to get it</label><input id="v-url" value="${esc(v.url || '')}" placeholder="an address everyone can open (leave empty if you hand it out yourself)">
        <label for="v-note">A line about it</label><input id="v-note" value="${esc(v.note || '')}" placeholder="What changed, in a few words">
        <div><button class="ms-btn ms-btn--go" type="submit">Save</button></div>
      </form>
      ${v.at ? `<p class="ms-row__s">Last set ${when(v.at)}.</p>` : ''}
      <form class="ms-form" id="ms-door" style="margin-top:34px">
        <label for="d-code">Invite code for new accounts</label><input id="d-code" value="${esc(door.code || '')}" placeholder="empty: anyone who reaches the server can make an account" autocomplete="off" autocapitalize="off" spellcheck="false">
        <label for="d-moved">The server's new address</label><input id="d-moved" value="${esc(door.moved_to || '')}" placeholder="empty: it lives here. https://… and every app follows it" autocapitalize="off" spellcheck="false">
        <div><button class="ms-btn ms-btn--go" type="submit">Save</button></div>
      </form>`;
    document.getElementById('ms-door').addEventListener('submit', async e => {
        e.preventDefault();
        const out = await api('door', { code: document.getElementById('d-code').value, moved_to: document.getElementById('d-moved').value });
        said.textContent = out.ok ? 'Saved.' : out.d.error;
    });
    document.getElementById('ms-ver').addEventListener('submit', async e => {
        e.preventDefault();
        const out = await api('version', { version: document.getElementById('v-version').value, url: document.getElementById('v-url').value, note: document.getElementById('v-note').value });
        said.textContent = out.ok ? 'Saved. Apps will see it within ten minutes.' : out.d.error;
    });
}

// ── the credits trial (gr_sim.py): the numbers, the playlist the shop is made from, credits ──
const RULES = [['start_credits', 'Credits to start with'], ['home_cost', 'Bring a track home'], ['buy_cost', 'Buy a track'],
    ['record_share', 'A whole record costs (% of its tracks)'], ['room_space', 'Room space (tracks brought home)'], ['wait_days', 'Days before a track taken out can come back']];
let SYNC_T = 0;
async function trial() {
    const r = await api('sim');
    if (!r.ok) { body.innerHTML = `<p class="ms-none">${esc(r.d.error)}</p>`; return; }
    const d = r.d, R = d.rules, pl = d.playlist || {};
    body.innerHTML = `
      <div class="ms-line"><label class="ms-switch"><input type="checkbox" id="t-on" ${R.on ? 'checked' : ''}> The trial is on</label>
        <span class="ms-row__s">${R.on ? 'Everyone brings home and buys with credits. No basket, no plans.' : 'Off: the old borrowing, plans and basket.'}</span></div>
      <h2 class="ms-h2">The numbers</h2>
      <div class="ms-grid">${RULES.map(([k, l]) => `<label>${l}<input type="number" min="${d.limits[k][0]}" max="${d.limits[k][1]}" data-rule="${k}" value="${esc(R[k])}"></label>`).join('')}</div>
      <div class="ms-line"><button class="ms-btn ms-btn--go" id="t-save">Save the numbers</button>
        <span class="ms-row__s">Changes count from now. Credits already given stay as they are; the starting credits are for people who haven't started yet.</span></div>

      <h2 class="ms-h2">The shop's playlist</h2>
      <p class="ms-row__s" style="max-width:700px">A public Spotify playlist you made. Read every hour while this app is open.</p>
      <div class="ms-line"><input id="t-pl" value="${esc(pl.url || '')}" placeholder="https://open.spotify.com/playlist/…" aria-label="The playlist's link">
        <button class="ms-btn" id="t-plsave">Save</button><button class="ms-btn ms-btn--go" id="t-sync" ${pl.id ? '' : 'disabled'}>Bring records in now</button></div>
      <div class="ms-row__s" id="t-syncsaid">${pl.synced_at ? `Last brought in ${when(pl.synced_at)}${pl.name ? ' from “' + esc(pl.name) + '”' : ''}${pl.note ? ' · ' + esc(pl.note) : ''}.` : (pl.note ? esc(pl.note) : '')}</div>
      <p class="ms-row__s">In the shop now: <b>${d.counts.records}</b> records, <b>${d.counts.tracks}</b> tracks, <b>${d.counts.artists}</b> artist accounts.</p>

      <h2 class="ms-h2">Give or take credits</h2>
      <div class="ms-line"><select id="t-who" aria-label="Who"><option value="all">Everyone</option>${d.people.map(p => `<option value="${p.id}">${esc(p.name)} (@${esc(p.handle)})</option>`).join('')}</select>
        <input id="t-n" type="number" style="width:110px" placeholder="50 or −50" aria-label="Credits">
        <input id="t-why" placeholder="why (kept in the ledger)" aria-label="Why"><button class="ms-btn" id="t-give">Give</button></div>`;
    document.getElementById('t-on').onchange = async e => { const o = await api('sim/rules', { on: e.target.checked }); said.textContent = o.ok ? (o.d.rules.on ? 'The trial is on.' : 'The trial is off.') : o.d.error; trial(); };
    document.getElementById('t-save').onclick = async () => {
        const send = {}; body.querySelectorAll('[data-rule]').forEach(i => send[i.dataset.rule] = i.value);
        const o = await api('sim/rules', send); said.textContent = o.ok ? 'Saved.' : o.d.error;
    };
    document.getElementById('t-plsave').onclick = async () => { const o = await api('sim/playlist', { url: document.getElementById('t-pl').value }); said.textContent = o.ok ? 'Saved.' : o.d.error; if (o.ok) trial(); };
    document.getElementById('t-sync').onclick = () => syncNow();
    document.getElementById('t-give').onclick = async () => {
        const who = document.getElementById('t-who').value, n = parseInt(document.getElementById('t-n').value, 10);
        if (!n) { said.textContent = 'How many credits?'; return; }
        const o = await api('sim/credits', Object.assign({ credits: n, note: document.getElementById('t-why').value }, who === 'all' ? { everyone: true } : { account_id: +who }));
        said.textContent = o.ok ? `Done — ${o.d.people} ${o.d.people === 1 ? 'person' : 'people'}.` : o.d.error;
    };
}
async function syncNow() {
    const out = document.getElementById('t-syncsaid');
    try { await fetch('/api/gr/sim/sync', { method: 'POST' }); } catch (_) {}
    clearInterval(SYNC_T);
    SYNC_T = setInterval(async () => {
        let s = {}; try { s = await (await fetch('/api/gr/sim/sync')).json(); } catch (_) {}
        if (!document.getElementById('t-syncsaid')) { clearInterval(SYNC_T); return; }
        if (s.running) { out.textContent = 'Reading… ' + (s.step || '') + (s.total ? ` (${s.done} of ${s.total} records)` : ''); return; }
        clearInterval(SYNC_T);
        if (s.error) { out.textContent = s.error; return; }
        const m = s.result || {};
        said.textContent = `Brought in ${m.records || 0} new records (${m.tracks || 0} tracks), ${m.artists || 0} new artist accounts.`;
        trial();
    }, 1200);
}

// ── Spotify keys: one key lets five people play Spotify from inside the Music Room ──
async function spotify() {
    const r = await api('sim');
    if (!r.ok) { body.innerHTML = `<p class="ms-none">${esc(r.d.error)}</p>`; return; }
    const d = r.d, keys = d.keys || [];
    const keyOf = id => keys.find(k => k.id === id);
    body.innerHTML = `
      <p class="gr-lede" style="max-width:720px">${d.per_key} people per key.</p>
      <p class="ms-row__s" style="max-width:720px">On developer.spotify.com, each person must also be added to that app (Settings → User Management: their name and the email of their Spotify account), and the app needs the address
        <code>http://127.0.0.1:5177/api/spotify/callback</code> under Redirect URIs. People need Spotify Premium for the deck to play their Spotify.</p>
      <h2 class="ms-h2">Keys</h2>
      <div id="k-list">${keys.map(k => `<div class="ms-line" data-key="${esc(k.id)}"><input data-f="label" value="${esc(k.label)}" style="flex:0 1 180px" aria-label="Name">
          <input data-f="client_id" value="${esc(k.client_id)}" aria-label="Client ID"><span class="ms-row__s">${k.people.length} of ${d.per_key}</span>
          <button class="ms-btn ms-btn--red" data-kx>Remove</button></div>`).join('') || '<p class="ms-none">No keys yet.</p>'}</div>
      <div class="ms-line"><input id="k-label" placeholder="a name, e.g. Daithí's app" style="flex:0 1 180px" aria-label="Name"><input id="k-cid" placeholder="Client ID (32 letters and numbers)" aria-label="Client ID">
        <button class="ms-btn" id="k-add">Add</button><button class="ms-btn ms-btn--go" id="k-save">Save keys</button></div>
      <h2 class="ms-h2">Who has which</h2>
      ${d.people.map(p => `<div class="ms-row"><div><div class="ms-row__t">${esc(p.name)}</div><div class="ms-row__s">@${esc(p.handle)} · ${esc(p.kind)}</div></div>
        <div class="ms-acts"><select data-person="${p.id}" aria-label="Spotify key for ${esc(p.name)}"><option value="">No key — Spotify's own player</option>
          ${keys.map(k => `<option value="${esc(k.id)}" ${p.spotify_key === k.id ? 'selected' : ''}>${esc(k.label)} (${k.people.length}/${d.per_key})</option>`).join('')}</select></div></div>`).join('')}`;
    const collect = () => [...body.querySelectorAll('#k-list [data-key]')].map(row => ({ id: row.dataset.key, label: row.querySelector('[data-f=label]').value, client_id: row.querySelector('[data-f=client_id]').value }));
    const save = async (list) => { const o = await api('spotify-keys', { keys: list }); said.textContent = o.ok ? 'Saved.' : o.d.error; if (o.ok) spotify(); };
    body.querySelectorAll('[data-kx]').forEach(b => b.onclick = () => { b.closest('[data-key]').remove(); });
    document.getElementById('k-add').onclick = () => { const c = document.getElementById('k-cid').value.trim(); if (!c) return; save(collect().concat([{ label: document.getElementById('k-label').value, client_id: c }])); };
    document.getElementById('k-save').onclick = () => save(collect());
    body.querySelectorAll('select[data-person]').forEach(sel => sel.onchange = async () => {
        const o = await api('spotify-keys/assign', { account_id: +sel.dataset.person, key: sel.value });
        said.textContent = o.ok ? 'Done. Their app picks it up the next time a page opens.' : o.d.error; spotify();
    });
}

// ── what everyone did with their credits ──
async function activity() {
    const r = await api('sim/activity');
    if (!r.ok) { body.innerHTML = `<p class="ms-none">${esc(r.d.error)}</p>`; return; }
    const ppl = r.d.people || [], R = r.d.rules || {};
    const sum = k => ppl.reduce((a, p) => a + (p[k] || 0), 0);
    body.innerHTML = `
      <p class="gr-lede" style="max-width:720px">Room space now: ${esc(R.room_space)}. ${sum('spent')} credits spent in all; ${sum('buys_when_full')} buys made with a full room.</p>
      <div class="ms-line"><a class="ms-btn" href="/api/gr/sim-csv/activity" download>This table as a spreadsheet</a>
        <a class="ms-btn" href="/api/gr/sim-csv/ledger" download>Every credit, as a spreadsheet</a></div>
      <div class="ms-wide"><table class="ms-table"><thead><tr>
        <th>Person</th><th>Credits left</th><th>Spent</th><th>on bringing home</th><th>on buying</th><th>Given</th><th>At home</th><th>Bought</th><th>Taken out</th>
        <th>Room</th><th>Refused: room full</th><th>Bought with room full</th><th>Refused: too few credits</th><th>Plays</th><th>One-plays in the shop</th><th>Last</th></tr></thead><tbody>
        ${ppl.map(p => `<tr><td>${esc(p.name)} <span class="ms-row__s">@${esc(p.handle)}</span></td><td>${p.credits == null ? '—' : p.credits}</td><td>${p.spent}</td>
          <td>${p.spent_home}</td><td>${p.spent_buy}</td><td>${p.given}</td><td>${p.home_now}</td><td>${p.bought}</td><td>${p.taken_out}</td>
          <td>${p.room_count} / ${p.room_space}</td><td>${p.full_refused}</td><td>${p.buys_when_full}</td><td>${p.short_refused}</td><td>${p.plays}</td><td>${p.one_plays}</td><td>${when(p.last) || '—'}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="ms-row__s">Plays are counted when a record is started from “Borrowed”, the listener’s records or a public room.</p>`;
}
